<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>دفتري</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px calc(env(safe-area-inset-right) + 24px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 24px);
      background: #FAF7F2;
      color: #374151;
      font-family: "SF Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .card { max-width: 340px; width: 100%; }
    img { width: 92px; height: 92px; border-radius: 22px; margin: 0 auto 18px; display: block; }
    h1 { font-size: 20px; font-weight: 700; color: #5C4B8C; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.7; color: #6B7280; margin: 0 0 22px; }
    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background: #B7A6E8;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
    }
    button:active { opacity: .75; }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="دفتري" />
    <h1>ما قدرنا نتصل بالإنترنت</h1>
    <p>دفتري يحتاج اتصال بالإنترنت عشان يعرض واجبات ودرجات أبنائك. تأكدي من الاتصال وحاولي مرة ثانية.</p>
    <button onclick="location.replace('https://daftary.reemora.app')">إعادة المحاولة</button>
  </div>
</body>
</html>
